[project]
name = "cdc-streaming-lakehouse"
version = "0.1.0"
description = "Postgres change data capture streamed into Delta Lake with Spark Structured Streaming."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deltalake>=1.2,<2",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pyspark==4.0.1",
]

[project.scripts]
cdclake = "cdclake.cli:main"

[dependency-groups]
# pgserver bundles a Postgres server, so tests need no Docker or system install.
dev = ["mypy>=1.11", "pgserver>=0.1.4", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdclake"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]

[tool.mypy]
files = ["src"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: starts Spark in a subprocess; run with -m slow, skipped by -m 'not slow'"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
